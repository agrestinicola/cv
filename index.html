<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nicola Agresti - CV</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👨‍💻</text></svg>">
    <meta property="og:image" content="https://www.nicolaagresti.it/social-preview.jpg">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-0N07L43HDN"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      // Configurazione con il tuo ID reale
      gtag('config', 'G-0N07L43HDN');
    </script>

    <script src="dati.js" defer></script>

    <style>
        /* --- 1. VARIABILI & TEMA --- */
        :root {
            /* DARK MODE (Default) */
            --bg-body: #121212;
            --bg-card: #1e1e1e;
            --bg-nav: #161616;
            --bg-input: #2d2d2d; 
            --text-main: #ffffff;
            --text-sub: #b0b0b0;
            --accent: #bb86fc;
            --border: #333333;
            --shadow: rgba(0,0,0,0.5);
            --ease-spring: cubic-bezier(0.175, 0.885, 0.32, 1.275);
            --ease-smooth: cubic-bezier(0.25, 1, 0.5, 1);
        }

        body.light-theme {
            --bg-body: #f4f4f9;
            --bg-card: #ffffff;
            --bg-nav: #ffffff;
            --bg-input: #f0f0f5;
            --text-main: #333333;
            --text-sub: #666666;
            --accent: #0056b3;
            --border: #e0e0e0;
            --shadow: rgba(0,0,0,0.05);
        }

        /* --- 2. BASE & LAYOUT --- */
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            line-height: 1.5;
            overscroll-behavior-y: none; 
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        a { color: var(--accent); text-decoration: none; }
        ul { list-style-position: inside; margin-left: 5px; }
        li { margin-bottom: 5px; color: var(--text-sub); font-size: 0.95rem; }

        .app-container {
            max-width: 650px;
            margin: 0 auto;
            min-height: 100vh;
            position: relative;
            /* SPAZIO DI SICUREZZA PER LO SCROLL */
            padding-bottom: 120px; 
        }

        /* --- 3. HEADER COMPATTO --- */
        header {
            padding: 20px 20px 10px 20px;
            text-align: center;
            position: relative;
        }

        .theme-toggle {
            position: absolute;
            top: 15px;
            right: 15px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-main);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 2px 8px var(--shadow);
            transition: transform 0.2s var(--ease-spring);
            z-index: 50;
            font-size: 0.9rem;
        }
        .theme-toggle:active { transform: scale(0.9); }

        .profile-img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--accent);
            margin-bottom: 10px;
            box-shadow: 0 5px 15px var(--shadow);
            aspect-ratio: 1/1; 
            transition: transform 0.3s var(--ease-smooth);
        }
        .profile-img:hover { transform: scale(1.05); }

        h1 { 
            font-size: 1.6rem;
            margin-bottom: 2px; 
            letter-spacing: -0.5px; 
            font-weight: 700; 
            line-height: 1.2;
        }
        
        .role { 
            color: var(--accent); 
            font-weight: 600; 
            font-size: 0.95rem; 
            margin-bottom: 15px;
            display: block;
        }
        
        .social-links {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 20px;
        }
        .social-btn {
            background: var(--bg-card);
            width: 42px;
            height: 42px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--border);
            color: var(--text-main);
            transition: all 0.3s var(--ease-spring);
            cursor: pointer;
            font-size: 1.1rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .social-btn:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-3px); }

        /* --- 4. SEZIONI & ANIMAZIONI --- */
        .content-section {
            display: none;
            padding: 0 20px; 
        }
        .content-section.active { 
            display: block; 
            animation: slideUpFade 0.5s var(--ease-smooth) forwards;
        }

        @keyframes slideUpFade {
            0% { opacity: 0; transform: translateY(20px) scale(0.98); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .section-title {
            font-size: 1.2rem;
            font-weight: 700;
            border-bottom: 2px solid var(--accent);
            padding-bottom: 6px;
            margin-bottom: 20px;
            margin-top: 5px;
            display: inline-block;
            letter-spacing: -0.3px;
        }

        /* --- 5. CARDS --- */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 12px var(--shadow);
            transition: transform 0.2s ease;
        }
        
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 8px;
            flex-wrap: wrap;
            gap: 5px;
        }
        
        .card h3 { font-size: 1.1rem; font-weight: 700; color: var(--text-main); margin-bottom: 2px; line-height: 1.3;}
        .card-subtitle { font-size: 0.9rem; color: var(--accent); font-weight: 600; display: block; width: 100%; margin-bottom: 8px;}
        .card-date { font-size: 0.75rem; color: var(--text-sub); background: rgba(255,255,255,0.08); padding: 4px 10px; border-radius: 6px; font-weight: 500; white-space: nowrap;}
        body.light-theme .card-date { background: rgba(0,0,0,0.06); }

        .tech-stack {
            margin-top: 15px;
            padding-top: 12px;
            border-top: 1px solid var(--border);
            font-size: 0.85rem;
            color: var(--text-sub);
            line-height: 1.4;
        }

        /* --- 6. CONTATTI MINIMAL --- */
        .contact-row {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .email-display {
            flex-grow: 1;
            background: var(--bg-input);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 14px 16px;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .btn-icon-square {
            width: 50px;
            height: 50px; 
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.1rem;
            transition: all 0.2s var(--ease-spring);
            flex-shrink: 0;
        }
        .btn-icon-square:hover { border-color: var(--accent); color: var(--accent); background: rgba(187, 134, 252, 0.1); }
        .btn-icon-square:active { transform: scale(0.9); }

        /* --- 7. PDF VIEWER & DOWNLOAD BTN --- */
        .pdf-container {
            width: 100%;
            height: 550px;
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            margin-top: 20px;
            position: relative;
            z-index: 1;
        }
        
        /* NUOVO STILE BOTTONE MINIMAL DOWNLOAD */
        .btn-round-floating {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 60px;
            height: 60px;
            background: var(--bg-card);
            color: var(--accent);
            border: 2px solid var(--accent);
            border-radius: 50%; /* Cerchio perfetto */
            font-size: 1.5rem;
            margin: 25px auto 0 auto; /* Centrato e staccato dal PDF */
            box-shadow: 0 6px 15px rgba(0,0,0,0.3);
            transition: all 0.2s var(--ease-spring);
            cursor: pointer;
        }
        .btn-round-floating:hover {
            background: var(--accent);
            color: #ffffff;
            transform: translateY(-3px) scale(1.05);
        }
        .btn-round-floating:active { transform: scale(0.95); }


        /* --- 8. NAVBAR --- */
        .nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(22, 22, 22, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            justify-content: space-around;
            padding: 12px 0 30px 0;
            border-top: 1px solid var(--border);
            /* Z-INDEX MASSIMO */
            z-index: 9999999; 
            box-shadow: 0 -5px 20px rgba(0,0,0,0.3);
            /* HARDWARE ACCELERATION */
            transform: translate3d(0, 0, 100px); 
        }
        body.light-theme .nav-bar { background: rgba(255, 255, 255, 0.9); }

        .nav-item {
            text-align: center;
            color: var(--text-sub);
            cursor: pointer;
            flex: 1;
            position: relative;
            transition: color 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .nav-item i { font-size: 1.4rem; margin-bottom: 5px; transition: transform 0.3s var(--ease-spring); }
        .nav-item span { font-size: 0.65rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; opacity: 0.8; }
        
        .nav-item.active { color: var(--accent); }
        .nav-item.active i { transform: translateY(-4px) scale(1.1); }
        .nav-item.active span { opacity: 1; }

        /* --- 9. DESKTOP TWEAKS (> 700px) --- */
        @media (min-width: 700px) {
            body { 
                padding: 40px 0 60px; 
                background-color: #000000; 
            }
            body.light-theme { background-color: #e0e0e0; }

            .app-container {
                border-radius: 30px;
                background: var(--bg-body);
                border: 1px solid var(--border);
                overflow: hidden; 
                padding-bottom: 100px;
                box-shadow: 0 0 80px rgba(0,0,0,0.5);
            }

            .nav-bar {
                position: fixed;
                bottom: 40px;
                left: 50%;
                transform: translateX(-50%);
                width: auto;
                min-width: 450px;
                max-width: 650px;
                border-radius: 60px;
                padding: 18px 40px;
                border: 1px solid rgba(255,255,255,0.1);
                box-shadow: 0 20px 50px rgba(0,0,0,0.5);
                background: rgba(22, 22, 22, 0.9);
                transform: translateX(-50%);
            }
            body.light-theme .nav-bar { background: rgba(255, 255, 255, 0.9); }

            .pdf-container { 
                height: 700px; 
            }
        }
    </style>
</head>
<body>

<div class="app-container">
    
    <header>
        <button class="theme-toggle" onclick="toggleTheme()"><i class="fas fa-sun" id="theme-icon"></i></button>
        <img id="u-img" src="" alt="Profile" class="profile-img">
        <h1 id="u-name"></h1>
        <span id="u-role" class="role"></span>
        
        <div class="social-links">
            <a id="lnk-linkedin" target="_blank" class="social-btn"><i class="fab fa-linkedin-in"></i></a>
            <a id="lnk-github" target="_blank" class="social-btn"><i class="fab fa-github"></i></a>
        </div>
    </header>

    <div id="home" class="content-section active">
        <h2 class="section-title">Chi sono</h2>
        <div class="card">
            <p id="u-desc"></p>
        </div>

        <h2 class="section-title">Contattami</h2>
        <div class="card">
            <div class="contact-row">
                <div id="u-email-display" class="email-display"></div>
                <button class="btn-icon-square" onclick="copyEmail(this)"><i class="far fa-copy"></i></button>
                <a id="btn-email-send" class="btn-icon-square"><i class="far fa-paper-plane"></i></a>
            </div>
        </div>
    </div>

    <div id="experience" class="content-section">
        <h2 class="section-title">Esperienza</h2>
        <div id="job-list">
            </div>
    </div>

    <div id="education" class="content-section">
        <h2 class="section-title">Formazione</h2>
        <div id="edu-list">
            </div>
        
        <h2 class="section-title">Certificazioni</h2>
        <div class="card">
            <ul id="cert-list">
                </ul>
        </div>
        
        <h2 class="section-title">Lingue</h2>
        <div class="card">
            <ul id="lang-list" style="list-style: none; margin: 0;">
                </ul>
        </div>
    </div>

    <div id="cv-viewer" class="content-section">
        <h2 class="section-title">Il mio CV</h2>
        <p style="margin-bottom: 15px; font-size: 0.95rem; color: var(--text-sub);">
            Visualizza l'anteprima o scarica il PDF completo.
        </p>
        
        <div class="pdf-container">
            <iframe id="iframe-cv" width="100%" height="100%" style="border:none;"></iframe>
        </div>

        <a id="btn-download-cv" download class="btn-round-floating" aria-label="Scarica PDF">
            <i class="fas fa-file-download"></i>
        </a>
    </div>

</div>

<nav class="nav-bar">
    <div class="nav-item active" onclick="showSection('home', this)">
        <i class="fas fa-user"></i><span>Profilo</span>
    </div>
    <div class="nav-item" onclick="showSection('experience', this)">
        <i class="fas fa-briefcase"></i><span>Lavoro</span>
    </div>
    <div class="nav-item" onclick="showSection('education', this)">
        <i class="fas fa-graduation-cap"></i><span>Studi</span>
    </div>
    <div class="nav-item" onclick="showSection('cv-viewer', this)">
        <i class="fas fa-file-lines"></i><span>CV</span>
    </div>
</nav>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        // --- 1. CONTROLLO DATI ---
        if(typeof cvData === 'undefined') {
            alert("Errore: file dati.js non trovato!");
            return;
        }

        // --- 2. POPOLAMENTO DATI ---
        
        // Header
        document.getElementById('u-name').textContent = cvData.profile.name;
        document.getElementById('u-role').textContent = cvData.profile.role;
        document.getElementById('u-img').src = cvData.profile.image;
        
        // Setup Social Links con Tracking
        setupLink('lnk-linkedin', cvData.profile.social.linkedin, 'Social', 'LinkedIn');
        setupLink('lnk-github', cvData.profile.social.github, 'Social', 'GitHub');

        // About & Contact
        document.getElementById('u-desc').textContent = cvData.about.description;
        document.getElementById('u-email-display').textContent = cvData.profile.email;
        setupLink('btn-email-send', "mailto:" + cvData.profile.email, 'Contact', 'Email Click');

        // Lavori
        const jobContainer = document.getElementById('job-list');
        cvData.experience.forEach(job => {
            let descHTML = "";
            job.desc.forEach(point => descHTML += `<li>${point}</li>`);
            jobContainer.innerHTML += `
            <div class="card">
                <div class="card-header">
                    <h3>${job.company}</h3>
                    <span class="card-date">${job.date}</span>
                </div>
                <span class="card-subtitle">${job.role}</span>
                <ul>${descHTML}</ul>
                <div class="tech-stack"><strong>Tech:</strong> ${job.tech}</div>
            </div>`;
        });

        // Studi
        const eduContainer = document.getElementById('edu-list');
        cvData.education.forEach(edu => {
            eduContainer.innerHTML += `
            <div class="card">
                <h3>${edu.title}</h3>
                <span class="card-subtitle">${edu.institute}</span>
                <span class="card-date" style="float:none; display:inline-block; margin-top:8px;">${edu.date}</span>
            </div>`;
        });

        // Certificazioni & Lingue
        const certContainer = document.getElementById('cert-list');
        cvData.certifications.forEach(cert => certContainer.innerHTML += `<li>${cert}</li>`);
        
        const langContainer = document.getElementById('lang-list');
        cvData.languages.forEach(lang => langContainer.innerHTML += `<li>${lang.flag} <strong>${lang.name}:</strong> ${lang.level}</li>`);

        // CV Download & Preview
        const cvPdf = cvData.profile.social.cv_pdf;
        document.getElementById('iframe-cv').src = cvPdf;
        
        // Setup Tasto Download con Tracking
        const btnDownload = document.getElementById('btn-download-cv');
        btnDownload.href = cvPdf;
        btnDownload.onclick = () => {
            trackEvent('file_download', {
                'file_name': 'CV_AgrestiNicola.pdf',
                'file_extension': 'pdf',
                'link_text': 'Download Button'
            });
        };
    });

    // --- 3. FUNZIONI UTILITY & TRACKING ---

    // Cambia Sezione + Tracking Pageview
    function showSection(id, el) {
        // UI Update
        document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        el.classList.add('active');
        window.scrollTo({top:0, behavior:'smooth'});

        // GA4 Virtual Page View
        trackEvent('page_view', {
            'page_title': id.charAt(0).toUpperCase() + id.slice(1),
            'page_location': window.location.href.split('#')[0] + '#' + id
        });
    }

    // Helper per configurare link con tracking
    function setupLink(elementId, url, category, label) {
        const el = document.getElementById(elementId);
        if(el) {
            el.href = url;
            el.onclick = () => {
                trackEvent('click', {
                    'event_category': category,
                    'event_label': label,
                    'transport_type': 'beacon'
                });
            };
        }
    }

    // Wrapper sicuro per GA4
    function trackEvent(eventName, params) {
        if (typeof gtag === 'function') {
            gtag('event', eventName, params);
            console.log('GA4 Event:', eventName, params); 
        }
    }

    function toggleTheme() {
        document.body.classList.toggle('light-theme');
        const isLight = document.body.classList.contains('light-theme');
        const icon = document.getElementById('theme-icon');
        icon.className = isLight ? 'fas fa-moon' : 'fas fa-sun';
        
        trackEvent('theme_change', { 'mode': isLight ? 'light' : 'dark' });
    }

    function copyEmail(btn) {
        const email = document.getElementById('u-email-display').textContent;
        navigator.clipboard.writeText(email).then(() => {
            const i = btn.querySelector('i');
            const originalClass = i.className;
            i.className = 'fas fa-check';
            btn.style.borderColor = '#00b894'; 
            btn.style.color = '#00b894';
            setTimeout(() => {
                i.className = originalClass; 
                btn.style.borderColor = ''; 
                btn.style.color = '';
            }, 2000);
            
            trackEvent('copy_email', { 'status': 'success' });
        });
    }
</script>
</body>
</html>
